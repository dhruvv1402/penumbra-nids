# Keeps the free Render API awake. Render sleeps a free service after 15 idle minutes, and the
# next visitor then waits about a minute for the console's first request. One /health call every
# 10 minutes keeps it up; a month of that is under Render's 750 free instance-hours, provided this
# is the workspace's only free service.
#
# GitHub pauses scheduled workflows in a repository with no commits for 60 days; re-enable it from
# the Actions tab if that happens. Runs can also start late when GitHub is busy.

name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /health
        # Generous timeout and retries: if it did fall asleep, waking takes about a minute.
        run: curl -fsS --max-time 120 --retry 3 --retry-delay 10 https://penumbra-api-koh3.onrender.com/health -o /dev/null
