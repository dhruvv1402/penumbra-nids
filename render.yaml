# Render Blueprint: the Penumbra API on the free plan. The console runs on Vercel (root directory
# `console`, PENUMBRA_API_URL = this service's URL, NEXT_PUBLIC_PENUMBRA_PUBLIC=1).
# Image and memory budget: deploy/render.Dockerfile.
services:
  - type: web
    name: penumbra-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Generated by Render on first deploy; visible only in the Render dashboard.
      - key: PENUMBRA_JWT_SECRET
        generateValue: true
      - key: PENUMBRA_PII_HMAC_KEY
        generateValue: true
      - key: PENUMBRA_ANALYST_PASSWORD
        generateValue: true
      - key: PENUMBRA_SENIOR_PASSWORD
        generateValue: true
      - key: PENUMBRA_ADMIN_PASSWORD
        generateValue: true
      - key: PENUMBRA_GUEST_ACCESS
        value: "1"
      - key: PENUMBRA_SIEM
        value: mock
